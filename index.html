<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaaralan Talkootie — HSL Stops</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5f6f8;
    color: #1a1c20;
    font-family: Helvetica, Arial, sans-serif;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .header { overflow: hidden; margin-bottom: 18px; }
  .header h1 {
    float: left;
    font-size: 20px;
    margin: 0;
    line-height: 1.3;
  }
  .header h1 span {
    display: block;
    font-weight: normal;
    font-size: 13px;
    color: #6b7280;
  }
  .header-actions { float: right; }
  .icon-btn {
    background: #ffffff;
    border: 1px solid #e3e5e8;
    color: #1a1c20;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    margin-left: 8px;
  }

  .status-line {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 16px;
    clear: both;
  }

  .stop-card {
    background: #ffffff;
    border: 1px solid #e3e5e8;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .stop-card h2 {
    font-size: 16px;
    margin: 0 0 2px;
  }
  .stop-card h2 .code {
    font-size: 12px;
    font-weight: normal;
    color: #6b7280;
    margin-left: 6px;
  }
  .stop-card .desc {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 12px;
  }

  table.departures { width: 100%; border-collapse: collapse; }
  table.departures td {
    padding: 9px 0;
    border-top: 1px solid #e3e5e8;
    font-size: 14px;
    vertical-align: middle;
  }
  table.departures tr:first-child td { border-top: none; }

  .line-badge-cell { width: 46px; }
  .line-badge {
    background: #007ac9;
    color: #ffffff;
    font-weight: bold;
    font-size: 13px;
    display: inline-block;
    min-width: 30px;
    text-align: center;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .headsign { padding-left: 10px; padding-right: 10px; }
  .eta {
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
    width: 70px;
  }
  .eta.realtime { color: #0a8a3f; }
  .eta-small {
    display: block;
    font-weight: normal;
    font-size: 11px;
    color: #6b7280;
  }

  .empty, .placeholder {
    color: #6b7280;
    font-size: 13px;
    padding: 8px 0;
  }
  .error-box {
    background: #eaf4fb;
    border: 1px solid #e3e5e8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #c62828;
    margin-bottom: 16px;
  }

  .settings-box {
    background: #ffffff;
    border: 1px solid #e3e5e8;
    border-radius: 14px;
    padding: 16px;
    margin-top: 24px;
  }
  .settings-box h3 { margin: 0 0 14px; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid #e3e5e8;
    background: #f5f6f8;
    color: #1a1c20;
    font-size: 14px;
  }
  .field .hint {
    font-size: 11px;
    color: #6b7280;
    margin-top: 4px;
  }
  .btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #e3e5e8;
    background: #f5f6f8;
    color: #1a1c20;
    font-size: 14px;
  }
  .btn.primary {
    background: #007ac9;
    border-color: #007ac9;
    color: #ffffff;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Vaaralan Talkootie<span>Next HSL departures</span></h1>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh now">&#8635;</button>
    </div>
  </div>

  <div class="status-line" id="statusLine">Loading&#8230;</div>
  <div id="stops"></div>

  <div class="settings-box">
    <h3>Settings</h3>
    <form id="settingsForm">
      <div class="field">
        <label for="stopId1">Stop 1 (code or gtfsId)</label>
        <input id="stopId1" type="text" placeholder="V9305">
      </div>
      <div class="field">
        <label for="stopId2">Stop 2 (code or gtfsId)</label>
        <input id="stopId2" type="text" placeholder="V9306">
        <div class="hint">A public HSL stop code (e.g. V9305) works directly, or use a full gtfsId (e.g. HSL:1174509).</div>
      </div>
      <div class="field">
        <label for="intervalInput">Refresh interval (seconds)</label>
        <input id="intervalInput" type="text" placeholder="30">
      </div>
      <button class="btn primary" type="submit">Save</button>
    </form>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "hsl-home-stop-settings";
  var DEFAULT_INTERVAL = 30;
  var DEFAULT_STOP1 = "V9305";
  var DEFAULT_STOP2 = "V9306";

  function byId(id) { return document.getElementById(id); }
  var stopsEl = byId("stops");
  var statusLine = byId("statusLine");

  var timer = null;

  function trim(s) { return (s || "").replace(/^\s+|\s+$/g, ""); }

  function loadSettings() {
    var stored = null;
    try {
      stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (e) {
      stored = null;
    }
    if (stored && stored.stopId1) {
      return stored;
    }
    return { stopId1: DEFAULT_STOP1, stopId2: DEFAULT_STOP2, interval: DEFAULT_INTERVAL };
  }

  function saveSettings(settings) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  }

  function applySettingsToForm() {
    var s = loadSettings();
    byId("stopId1").value = s.stopId1 || "";
    byId("stopId2").value = s.stopId2 || "";
    byId("intervalInput").value = s.interval || DEFAULT_INTERVAL;
  }

  function setText(el, text) {
    el.innerHTML = "";
    el.appendChild(document.createTextNode(text));
  }

  byId("settingsForm").onsubmit = function () {
    var interval = parseInt(byId("intervalInput").value, 10);
    if (!interval || interval < 10) interval = DEFAULT_INTERVAL;
    saveSettings({
      stopId1: trim(byId("stopId1").value),
      stopId2: trim(byId("stopId2").value),
      interval: interval
    });
    scheduleRefresh();
    loadAndRender();
    return false;
  };

  byId("refreshBtn").onclick = function () {
    loadAndRender();
  };

  function fetchStop(gtfsId, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/departures?stop=" + encodeURIComponent(gtfsId), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var json = null;
      try {
        json = JSON.parse(xhr.responseText);
      } catch (e) {
        callback(new Error("Invalid response from server"));
        return;
      }
      if (xhr.status < 200 || xhr.status >= 300) {
        callback(new Error((json && json.error) || ("HTTP " + xhr.status)));
        return;
      }
      if (json.errors && json.errors.length) {
        var msgs = [];
        for (var i = 0; i < json.errors.length; i++) {
          msgs.push(json.errors[i].message);
        }
        callback(new Error(msgs.join("; ")));
        return;
      }
      callback(null, json.data ? json.data.stop : null);
    };
    xhr.onerror = function () {
      callback(new Error("Network error"));
    };
    xhr.send();
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function formatEta(epochSeconds) {
    var now = new Date().getTime() / 1000;
    var diffMin = Math.round((epochSeconds - now) / 60);
    var t = new Date(epochSeconds * 1000);
    var clock = pad2(t.getHours()) + ":" + pad2(t.getMinutes());
    if (diffMin <= 0) return { big: "Now", small: clock };
    if (diffMin < 60) return { big: diffMin + " min", small: clock };
    return { big: clock, small: "" };
  }

  function renderStopCard(stop) {
    var card = document.createElement("div");
    card.className = "stop-card";

    var h2 = document.createElement("h2");
    h2.appendChild(document.createTextNode(stop.name || "Unknown stop"));
    if (stop.code) {
      var code = document.createElement("span");
      code.className = "code";
      code.appendChild(document.createTextNode(stop.code));
      h2.appendChild(code);
    }
    card.appendChild(h2);

    if (stop.desc) {
      var desc = document.createElement("div");
      desc.className = "desc";
      desc.appendChild(document.createTextNode(stop.desc));
      card.appendChild(desc);
    }

    var departures = stop.stoptimesWithoutPatterns || [];
    if (!departures.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.appendChild(document.createTextNode("No upcoming departures."));
      card.appendChild(empty);
      return card;
    }

    var table = document.createElement("table");
    table.className = "departures";

    for (var i = 0; i < departures.length; i++) {
      var dep = departures[i];
      var tr = document.createElement("tr");

      var badgeTd = document.createElement("td");
      badgeTd.className = "line-badge-cell";
      var badge = document.createElement("span");
      badge.className = "line-badge";
      var shortName = (dep.trip && dep.trip.route && dep.trip.route.shortName) || "?";
      badge.appendChild(document.createTextNode(shortName));
      badgeTd.appendChild(badge);
      tr.appendChild(badgeTd);

      var headsignTd = document.createElement("td");
      headsignTd.className = "headsign";
      headsignTd.appendChild(document.createTextNode(dep.headsign || ""));
      tr.appendChild(headsignTd);

      var epoch = dep.serviceDay + (dep.realtime ? dep.realtimeDeparture : dep.scheduledDeparture);
      var eta = formatEta(epoch);
      var etaTd = document.createElement("td");
      etaTd.className = dep.realtime ? "eta realtime" : "eta";
      etaTd.appendChild(document.createTextNode(eta.big));
      if (eta.small) {
        var small = document.createElement("span");
        small.className = "eta-small";
        small.appendChild(document.createTextNode(eta.small));
        etaTd.appendChild(small);
      }
      tr.appendChild(etaTd);

      table.appendChild(tr);
    }
    card.appendChild(table);
    return card;
  }

  function loadAndRender() {
    var settings = loadSettings();

    if (!settings.stopId1) {
      stopsEl.innerHTML = "";
      var placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      placeholder.appendChild(document.createTextNode("Add your stop codes below to get started."));
      stopsEl.appendChild(placeholder);
      setText(statusLine, "Not configured");
      return;
    }

    var ids = [];
    if (settings.stopId1) ids.push(settings.stopId1);
    if (settings.stopId2) ids.push(settings.stopId2);

    setText(statusLine, "Refreshing...");

    var results = new Array(ids.length);
    var remaining = ids.length;

    function finish() {
      remaining -= 1;
      if (remaining > 0) return;

      stopsEl.innerHTML = "";
      var hadError = false;

      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        if (r.error) {
          hadError = true;
          var err = document.createElement("div");
          err.className = "error-box";
          err.appendChild(document.createTextNode('Stop "' + ids[i] + '": ' + r.error.message));
          stopsEl.appendChild(err);
          continue;
        }
        if (!r.stop) {
          hadError = true;
          var err2 = document.createElement("div");
          err2.className = "error-box";
          err2.appendChild(document.createTextNode('Stop "' + ids[i] + '" not found. Check the code in settings.'));
          stopsEl.appendChild(err2);
          continue;
        }
        stopsEl.appendChild(renderStopCard(r.stop));
      }

      var now = new Date();
      var timeStr = pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
      setText(statusLine, (hadError ? "Updated with errors " : "Updated ") + timeStr);
    }

    var makeCallback = function (index) {
      return function (err, stop) {
        results[index] = { error: err, stop: stop };
        finish();
      };
    };

    for (var i = 0; i < ids.length; i++) {
      fetchStop(ids[i], makeCallback(i));
    }
  }

  function scheduleRefresh() {
    if (timer) {
      clearInterval(timer);
    }
    var settings = loadSettings();
    var seconds = settings.interval || DEFAULT_INTERVAL;
    timer = setInterval(loadAndRender, seconds * 1000);
  }

  applySettingsToForm();
  loadAndRender();
  scheduleRefresh();
})();
</script>
</body>
</html>
