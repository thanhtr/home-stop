<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Vaaralan Talkootie">
<title>Vaaralan Talkootie — HSL Stops</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5f6f8;
    color: #1a1c20;
    font-family: Helvetica, Arial, sans-serif;
    padding: 20px 16px 60px;
  }
  .wrap { width: 100%; }

  .stops-row { overflow: hidden; }
  .stop-col { float: left; width: 36%; }
  .weather-col { float: right; width: 60%; }

  @media (max-width: 480px) {
    .stop-col, .weather-col { width: 100%; float: none; }
  }

  .status-line {
    font-size: 12px;
    color: #6b7280;
    margin-top: 12px;
  }

  .stop-card {
    background: #ffffff;
    border: 1px solid #e3e5e8;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .stop-card h2 {
    font-size: 26px;
    margin: 0 0 4px;
  }
  .stop-card h2 .code {
    font-size: 15px;
    font-weight: normal;
    color: #6b7280;
    margin-left: 8px;
  }
  .stop-card .desc {
    font-size: 15px;
    color: #6b7280;
    margin-bottom: 14px;
  }

  table.departures { width: 100%; border-collapse: collapse; }
  table.departures td {
    padding: 14px 0;
    border-top: 1px solid #e3e5e8;
    font-size: 22px;
    vertical-align: middle;
  }
  table.departures tr:first-child td { border-top: none; }

  .line-badge-cell { width: 68px; }
  .line-badge {
    background: #007ac9;
    color: #ffffff;
    font-weight: bold;
    font-size: 20px;
    display: inline-block;
    min-width: 46px;
    text-align: center;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .headsign { padding-left: 14px; padding-right: 14px; }
  .eta {
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
    width: 96px;
  }
  .eta.realtime { color: #0a8a3f; }
  .eta-small {
    display: block;
    font-weight: normal;
    font-size: 14px;
    color: #6b7280;
  }

  .empty, .placeholder {
    color: #6b7280;
    font-size: 15px;
    padding: 8px 0;
  }
  .error-box {
    background: #eaf4fb;
    border: 1px solid #e3e5e8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    color: #c62828;
    margin-bottom: 16px;
  }

  table.weather-main { width: 100%; border-collapse: collapse; }
  table.weather-main td { padding: 0; vertical-align: middle; }
  .weather-side { padding-left: 20px; text-align: left; }

  .weather-icon { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .weather-temp {
    display: inline-block;
    vertical-align: middle;
    font-size: 76px;
    font-weight: bold;
    line-height: 1;
  }
  .weather-desc {
    font-size: 22px;
    font-weight: bold;
    color: #333333;
    margin-top: 8px;
  }
  .weather-meta {
    font-size: 17px;
    color: #6b7280;
    line-height: 1.9;
  }

  .weather-hourly-heading {
    font-size: 13px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 20px;
    margin-bottom: 6px;
  }
  .hour-chip {
    display: inline-block;
    width: 16%;
    min-width: 54px;
    text-align: center;
    vertical-align: top;
    padding: 6px 2px;
  }
  .hour-chip-time { font-size: 13px; color: #6b7280; }
  .hour-chip-temp { font-size: 16px; font-weight: bold; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stops-row">
    <div class="stop-col" id="stopCol0"><div class="placeholder">Loading&#8230;</div></div>
    <div class="weather-col" id="weatherCol"><div class="placeholder">Loading&#8230;</div></div>
  </div>
</div>

<script>
(function () {
  var STOP_IDS = ["V9305"];
  var DEPARTURES_REFRESH_SECONDS = 30;
  var WEATHER_REFRESH_SECONDS = 3600;

  function byId(id) { return document.getElementById(id); }
  var stopCols = [byId("stopCol0")];
  var weatherCol = byId("weatherCol");

  function getJson(url, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var json = null;
      try {
        json = JSON.parse(xhr.responseText);
      } catch (e) {
        callback(new Error("Invalid response from server"));
        return;
      }
      if (xhr.status < 200 || xhr.status >= 300) {
        callback(new Error((json && json.error) || ("HTTP " + xhr.status)));
        return;
      }
      callback(null, json);
    };
    xhr.onerror = function () {
      callback(new Error("Network error"));
    };
    xhr.send();
  }

  function fetchStop(gtfsId, callback) {
    getJson("/api/departures?stop=" + encodeURIComponent(gtfsId), function (err, json) {
      if (err) {
        callback(err);
        return;
      }
      if (json.errors && json.errors.length) {
        var msgs = [];
        for (var i = 0; i < json.errors.length; i++) {
          msgs.push(json.errors[i].message);
        }
        callback(new Error(msgs.join("; ")));
        return;
      }
      callback(null, json.data ? json.data.stop : null);
    });
  }

  function fetchWeather(callback) {
    getJson("/api/weather", function (err, json) {
      if (err) {
        callback(err);
        return;
      }
      callback(null, json);
    });
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function formatEta(epochSeconds) {
    var now = new Date().getTime() / 1000;
    var diffMin = Math.round((epochSeconds - now) / 60);
    var t = new Date(epochSeconds * 1000);
    var clock = pad2(t.getHours()) + ":" + pad2(t.getMinutes());
    if (diffMin <= 0) return { big: "Now", small: clock };
    if (diffMin < 60) return { big: diffMin + " min", small: clock };
    return { big: clock, small: "" };
  }

  function currentTimeStr() {
    var now = new Date();
    return pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
  }

  function formatHour(isoLocalString) {
    // Open-Meteo returns local times like "2026-09-14T22:00" (already in the
    // requested timezone) -- just take the HH:MM part, no Date parsing needed.
    var parts = (isoLocalString || "").split("T");
    return parts.length > 1 ? parts[1] : (isoLocalString || "");
  }

  // Inline SVG weather icons, built from plain shapes (no emoji/font glyphs --
  // several weather emoji were added to Unicode/fonts after old iOS shipped
  // and would render as blank boxes there, but SVG has always worked).
  var SVG_NS = "http://www.w3.org/2000/svg";
  var CLOUD_COLOR = "#9aa5b1";
  var SUN_COLOR = "#f4a623";
  var RAIN_COLOR = "#3b8fd1";
  var SNOW_COLOR = "#8fbce6";

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var key in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, key)) {
        el.setAttribute(key, attrs[key]);
      }
    }
    return el;
  }

  function addCloud(svg, cx, cy, scale, color) {
    svg.appendChild(svgEl("circle", { cx: cx - 8 * scale, cy: cy + 2 * scale, r: 7 * scale, fill: color }));
    svg.appendChild(svgEl("circle", { cx: cx, cy: cy - 4 * scale, r: 9 * scale, fill: color }));
    svg.appendChild(svgEl("circle", { cx: cx + 9 * scale, cy: cy + 2 * scale, r: 7 * scale, fill: color }));
    svg.appendChild(svgEl("rect", {
      x: cx - 14 * scale, y: cy, width: 28 * scale, height: 10 * scale, rx: 5 * scale, fill: color
    }));
  }

  function addSun(svg, cx, cy, r, color) {
    svg.appendChild(svgEl("circle", { cx: cx, cy: cy, r: r, fill: color }));
    var rayLen = r * 0.6;
    var rayGap = r * 0.35;
    var angles = [0, 45, 90, 135, 180, 225, 270, 315];
    for (var i = 0; i < angles.length; i++) {
      var rad = (angles[i] * Math.PI) / 180;
      var x1 = cx + Math.cos(rad) * (r + rayGap);
      var y1 = cy + Math.sin(rad) * (r + rayGap);
      var x2 = cx + Math.cos(rad) * (r + rayGap + rayLen);
      var y2 = cy + Math.sin(rad) * (r + rayGap + rayLen);
      svg.appendChild(svgEl("line", {
        x1: x1, y1: y1, x2: x2, y2: y2,
        stroke: color, "stroke-width": r * 0.22, "stroke-linecap": "round"
      }));
    }
  }

  function addRainDrops(svg, cx, cy, color) {
    var xs = [cx - 8, cx, cx + 8];
    for (var i = 0; i < xs.length; i++) {
      svg.appendChild(svgEl("line", {
        x1: xs[i], y1: cy, x2: xs[i] - 2, y2: cy + 8,
        stroke: color, "stroke-width": 2.6, "stroke-linecap": "round"
      }));
    }
  }

  function addSnowDots(svg, cx, cy, color) {
    var xs = [cx - 8, cx, cx + 8];
    for (var i = 0; i < xs.length; i++) {
      svg.appendChild(svgEl("circle", { cx: xs[i], cy: cy + 5, r: 2, fill: color }));
    }
  }

  function addBolt(svg, cx, cy, color) {
    var points =
      (cx + 2) + "," + cy + " " +
      (cx - 4) + "," + (cy + 10) + " " +
      cx + "," + (cy + 10) + " " +
      (cx - 2) + "," + (cy + 20) + " " +
      (cx + 6) + "," + (cy + 8) + " " +
      cx + "," + (cy + 8);
    svg.appendChild(svgEl("polygon", { points: points, fill: color }));
  }

  function weatherIcon(category, size) {
    var svg = svgEl("svg", { viewBox: "0 0 48 48", width: size, height: size, "class": "weather-icon" });

    if (category === "clear") {
      addSun(svg, 24, 24, 11, SUN_COLOR);
    } else if (category === "partly") {
      addSun(svg, 17, 17, 8, SUN_COLOR);
      addCloud(svg, 27, 27, 0.85, CLOUD_COLOR);
    } else if (category === "rain") {
      addCloud(svg, 24, 20, 1, CLOUD_COLOR);
      addRainDrops(svg, 24, 32, RAIN_COLOR);
    } else if (category === "snow") {
      addCloud(svg, 24, 20, 1, CLOUD_COLOR);
      addSnowDots(svg, 24, 32, SNOW_COLOR);
    } else if (category === "thunder") {
      addCloud(svg, 24, 18, 1, CLOUD_COLOR);
      addBolt(svg, 22, 26, SUN_COLOR);
    } else {
      addCloud(svg, 24, 22, 1.05, CLOUD_COLOR);
    }

    return svg;
  }

  function renderStopCard(stop) {
    var card = document.createElement("div");
    card.className = "stop-card";

    var h2 = document.createElement("h2");
    h2.appendChild(document.createTextNode(stop.name || "Unknown stop"));
    if (stop.code) {
      var code = document.createElement("span");
      code.className = "code";
      code.appendChild(document.createTextNode(stop.code));
      h2.appendChild(code);
    }
    card.appendChild(h2);

    if (stop.desc) {
      var desc = document.createElement("div");
      desc.className = "desc";
      desc.appendChild(document.createTextNode(stop.desc));
      card.appendChild(desc);
    }

    var departures = stop.stoptimesWithoutPatterns || [];
    if (!departures.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.appendChild(document.createTextNode("No upcoming departures."));
      card.appendChild(empty);
      return card;
    }

    var table = document.createElement("table");
    table.className = "departures";

    for (var i = 0; i < departures.length; i++) {
      var dep = departures[i];
      var tr = document.createElement("tr");

      var badgeTd = document.createElement("td");
      badgeTd.className = "line-badge-cell";
      var badge = document.createElement("span");
      badge.className = "line-badge";
      var shortName = (dep.trip && dep.trip.route && dep.trip.route.shortName) || "?";
      badge.appendChild(document.createTextNode(shortName));
      badgeTd.appendChild(badge);
      tr.appendChild(badgeTd);

      var headsignTd = document.createElement("td");
      headsignTd.className = "headsign";
      headsignTd.appendChild(document.createTextNode(dep.headsign || ""));
      tr.appendChild(headsignTd);

      var epoch = dep.serviceDay + (dep.realtime ? dep.realtimeDeparture : dep.scheduledDeparture);
      var eta = formatEta(epoch);
      var etaTd = document.createElement("td");
      etaTd.className = dep.realtime ? "eta realtime" : "eta";
      etaTd.appendChild(document.createTextNode(eta.big));
      if (eta.small) {
        var small = document.createElement("span");
        small.className = "eta-small";
        small.appendChild(document.createTextNode(eta.small));
        etaTd.appendChild(small);
      }
      tr.appendChild(etaTd);

      table.appendChild(tr);
    }
    card.appendChild(table);
    return card;
  }

  function renderWeatherCard(weather) {
    var card = document.createElement("div");
    card.className = "stop-card";

    var h2 = document.createElement("h2");
    h2.appendChild(document.createTextNode(weather.location || "Weather"));
    card.appendChild(h2);

    var current = weather.current || {};

    var mainTable = document.createElement("table");
    mainTable.className = "weather-main";
    var mainTr = document.createElement("tr");

    var primaryTd = document.createElement("td");
    primaryTd.appendChild(weatherIcon(current.category, 64));

    var temp = document.createElement("span");
    temp.className = "weather-temp";
    var tempValue = typeof current.temperature === "number" ? Math.round(current.temperature) + "°C" : "--";
    temp.appendChild(document.createTextNode(tempValue));
    primaryTd.appendChild(temp);

    var desc = document.createElement("div");
    desc.className = "weather-desc";
    desc.appendChild(document.createTextNode(current.description || "Unknown"));
    primaryTd.appendChild(desc);

    mainTr.appendChild(primaryTd);

    var sideTd = document.createElement("td");
    sideTd.className = "weather-side";
    var meta = document.createElement("div");
    meta.className = "weather-meta";
    var metaLines = [];
    if (typeof current.apparentTemperature === "number") {
      metaLines.push("Feels like " + Math.round(current.apparentTemperature) + "°C");
    }
    if (typeof current.windSpeed === "number") {
      metaLines.push("Wind " + Math.round(current.windSpeed) + " m/s");
    }
    if (typeof current.humidity === "number") {
      metaLines.push("Humidity " + Math.round(current.humidity) + "%");
    }
    for (var i = 0; i < metaLines.length; i++) {
      if (i > 0) meta.appendChild(document.createElement("br"));
      meta.appendChild(document.createTextNode(metaLines[i]));
    }
    sideTd.appendChild(meta);
    mainTr.appendChild(sideTd);

    mainTable.appendChild(mainTr);
    card.appendChild(mainTable);

    var hourly = weather.hourly || [];
    if (hourly.length) {
      var heading = document.createElement("div");
      heading.className = "weather-hourly-heading";
      heading.appendChild(document.createTextNode("Rest of today"));
      card.appendChild(heading);

      for (var h = 0; h < hourly.length; h++) {
        var hour = hourly[h];
        var chip = document.createElement("div");
        chip.className = "hour-chip";

        var chipTime = document.createElement("div");
        chipTime.className = "hour-chip-time";
        chipTime.appendChild(document.createTextNode(formatHour(hour.time)));
        chip.appendChild(chipTime);

        chip.appendChild(weatherIcon(hour.category, 24));

        var chipTemp = document.createElement("div");
        chipTemp.className = "hour-chip-temp";
        var chipTempValue = typeof hour.temperature === "number" ? Math.round(hour.temperature) + "°" : "--";
        chipTemp.appendChild(document.createTextNode(chipTempValue));
        chip.appendChild(chipTemp);

        card.appendChild(chip);
      }
    }

    return card;
  }

  function loadDepartures() {
    var results = new Array(STOP_IDS.length);
    var remaining = STOP_IDS.length;

    function finish() {
      remaining -= 1;
      if (remaining > 0) return;

      var hadError = false;
      var lastCol = stopCols[stopCols.length - 1];

      for (var i = 0; i < results.length; i++) {
        var col = stopCols[i];
        col.innerHTML = "";
        var r = results[i];
        if (r.error) {
          hadError = true;
          var err = document.createElement("div");
          err.className = "error-box";
          err.appendChild(document.createTextNode('Stop "' + STOP_IDS[i] + '": ' + r.error.message));
          col.appendChild(err);
          continue;
        }
        if (!r.stop) {
          hadError = true;
          var err2 = document.createElement("div");
          err2.className = "error-box";
          err2.appendChild(document.createTextNode('Stop "' + STOP_IDS[i] + '" not found.'));
          col.appendChild(err2);
          continue;
        }
        col.appendChild(renderStopCard(r.stop));
      }

      var status = document.createElement("div");
      status.className = "status-line";
      status.appendChild(document.createTextNode((hadError ? "Updated with errors " : "Updated ") + currentTimeStr()));
      lastCol.appendChild(status);
    }

    var makeCallback = function (index) {
      return function (err, stop) {
        results[index] = { error: err, stop: stop };
        finish();
      };
    };

    for (var i = 0; i < STOP_IDS.length; i++) {
      fetchStop(STOP_IDS[i], makeCallback(i));
    }
  }

  function loadWeather() {
    fetchWeather(function (err, weather) {
      weatherCol.innerHTML = "";
      if (err) {
        var errBox = document.createElement("div");
        errBox.className = "error-box";
        errBox.appendChild(document.createTextNode("Weather: " + err.message));
        weatherCol.appendChild(errBox);
        return;
      }
      weatherCol.appendChild(renderWeatherCard(weather));
    });
  }

  loadDepartures();
  loadWeather();
  setInterval(loadDepartures, DEPARTURES_REFRESH_SECONDS * 1000);
  setInterval(loadWeather, WEATHER_REFRESH_SECONDS * 1000);
})();
</script>
</body>
</html>
